name: smart_wms
description: "Hệ Thống Quản Lý Kho Hàng Thông Minh (Smart WMS) - Flutter Clean Architecture"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5

  # --- Routing ---
  go_router: ^15.1.2

  # --- Backend (Supabase) ---
  supabase_flutter: ^2.9.0

  # --- Immutable Models & Serialization ---
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # --- Functional Error Handling ---
  fpdart: ^1.1.0

  # --- Barcode / QR Scanning (ML Kit on-device) ---
  mobile_scanner: ^6.0.2

  # --- OCR Text Recognition (ML Kit on-device) ---
  google_mlkit_text_recognition: ^0.14.0

  # --- Speech-to-Text ---
  speech_to_text: ^7.0.0

  # --- Network ---
  internet_connection_checker_plus: ^2.7.1

  # --- Charts (Dashboard) ---
  fl_chart: ^0.70.2

  # --- Export Reports ---
  excel: ^4.0.6
  pdf: ^3.11.2
  printing: ^5.13.5

  # --- Utilities ---
  intl: ^0.19.0
  uuid: ^4.5.1
  logger: ^2.5.0
  flutter_dotenv: ^5.2.1
  equatable: ^2.0.7

  # --- UI Helpers ---
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # --- Code Generation ---
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.4

  # --- Linting ---
  very_good_analysis: ^7.0.0

  # --- Testing ---
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
